# iPod-vault keybindings for the mango Wayland compositor.
# Append to ~/.config/mango/config.conf, then: mmsg dispatch reload_config

# Generate a strong password -> copy to clipboard (auto-clears in 45s)
bind=Alt+SHIFT,space,spawn,/home/mino/bin/genpass-copy

# Open the encrypted iPod vault menu (mounts iPod, decrypts in RAM)
bind=Alt,v,spawn,/home/mino/bin/vault
